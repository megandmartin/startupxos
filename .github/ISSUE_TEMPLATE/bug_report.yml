name: Bug report
description: Something in the startupxOS desktop preview or guided demo does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Leave out company data, passwords, recovery keys, connection details and account tokens. Use private security reporting for security concerns.
  - type: dropdown
    id: where
    attributes:
      label: Which experience did you use?
      options:
        - Mac website download
        - Mac TestFlight
        - Guided web demo
        - Older Windows preview
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and build
      description: On Mac, check startupxOS > About startupxOS or TestFlight. If the build is not shown, write unknown.
      placeholder: "0.2.18 (5), or version 0.2.18 / build unknown"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and device
      placeholder: "macOS version and Mac chip, or browser and version"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the actions you took. Use fictional examples rather than real company content.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Expected result and actual result
      description: Include the exact error if safe. Screenshots are useful after removing all private information.
    validations:
      required: true
