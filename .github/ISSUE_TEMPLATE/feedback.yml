name: Feedback or idea
description: Tell us what would make startupxOS more useful for your company.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This page is public, so leave out anything private about your company.
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What were you trying to do, and what got in the way?
    validations:
      required: true
